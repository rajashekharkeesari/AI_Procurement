services:
  backend:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    container_name: procurement-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./procurement.db:/app/procurement.db
      - ./workflow_checkpoints.db:/app/workflow_checkpoints.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Set EC2_PUBLIC_IP in the server's .env (compose reads it for substitution)
        VITE_API_BASE_URL: "http://${EC2_PUBLIC_IP:-localhost}:8000"
    container_name: procurement-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
