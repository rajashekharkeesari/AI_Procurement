version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    container_name: procurement-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./procurement.db:/app/procurement.db
      - ./workflow_checkpoints.db:/app/workflow_checkpoints.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "/api"
    container_name: procurement-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
